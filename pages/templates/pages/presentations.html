{% extends 'base.html' %}

{% load static i18n %}

{% block content %}

    <!-- Wrapper -->
    <div class="wrapper">

        <!-- Section Started: headline, hazard stripe, breadcrumbs as the mono subline -->
        <div class="section started brand-hero-page" id="section-started">
            <h1 class="hero-title">{% trans "Presentations" %}</h1>
            <span class="hazard" aria-hidden="true"></span>
            <p class="hero-subline"><a href="{% url 'home' %}">{% trans "Home" %}</a> / {% trans "Presentations" %}</p>
        </div>

        <!-- Presentation Content -->
        <div class="section blog">
            <div class="content content-box">
                <div class="single-post-text">

                    <!-- title -->
                    <div class="title">
                        <div class="title_inner">{% trans "Modern Engineering" %}</div>
                    </div>

                    <!-- PDF Viewer -->
                    <div class="pdf-viewer" style="width: 100%; margin-top: 20px;">
                        <iframe
                            id="pdf-frame"
                            src="{% url 'serve_presentation' 'modern-engineering.pdf' %}"
                            width="100%"
                            height="800px"
                            style="border: none; border-radius: 5px;"
                            title="{% trans 'Modern Engineering Presentation' %}"
                            allowfullscreen
                        ></iframe>
                        <div style="margin-top: 15px; display: flex; gap: 15px; align-items: center;">
                            <a class="btn hover-animated" href="javascript:void(0)" onclick="document.getElementById('pdf-frame').requestFullscreen()">
                                <span class="circle"></span>
                                <span class="lnk">{% trans "Fullscreen" %}</span>
                            </a>
                            <a class="btn hover-animated" href="{% url 'serve_presentation' 'modern-engineering.pdf' %}" download>
                                <span class="circle"></span>
                                <span class="lnk">{% trans "Download PDF" %}</span>
                            </a>
                        </div>
                    </div>

                </div>
                <div class="clear"></div>
            </div>
        </div>

    </div>

{% endblock content %}
