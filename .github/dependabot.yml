# Weekly dependency update PRs against the current poetry.lock.
# Dependabot's "pip" ecosystem reads pyproject.toml + poetry.lock.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    # Patch and minor bumps land in one PR so they are tested and deployed together.
    groups:
      python-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "build(deps)"
    labels:
      - "dependencies"
